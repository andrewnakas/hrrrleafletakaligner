name: Download HRRR Data and Deploy to Pages

on:
  push:
    branches:
      - '**'  # Trigger on all branches for fast testing
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install numpy xarray cfgrib netCDF4 requests pygrib

      - name: Download and process HRRR data
        run: |
          python scripts/download_hrrr.py

      - name: List generated files
        run: |
          echo "Generated files:"
          ls -lh public/
          echo "---"
          cat public/metadata.json

      # Upload as regular artifact for testing on any branch
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrrr-viewer-${{ github.run_number }}-${{ github.sha }}
          path: public/
          retention-days: 7

      # GitHub Pages deployment (only on main branch)
      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
